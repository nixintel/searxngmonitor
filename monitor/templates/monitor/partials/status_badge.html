{% if status == "success" %}<span class="badge text-bg-success">success</span>
{% elif status == "failed" %}<span class="badge text-bg-danger" {% if error %}title="{{ error }}"{% endif %}>failed</span>
{% elif status == "running" %}<span class="badge text-bg-primary"><span class="spinner-border spinner-border-sm"></span> running</span>
{% elif status == "queued" %}<span class="badge text-bg-info">queued</span>
{% elif status == "skipped" %}<span class="badge text-bg-secondary" {% if error %}title="{{ error }}"{% endif %}>skipped</span>
{% else %}<span class="text-body-secondary">never run</span>{% endif %}
