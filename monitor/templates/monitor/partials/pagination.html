{% load monitor_tags %}
{% if page.has_other_pages %}
<nav class="mt-3">
  <ul class="pagination pagination-sm flex-wrap">
    {% if page.has_previous %}
      <li class="page-item"><a class="page-link" {% if hx_url %}hx-get="{{ hx_url }}?{% url_replace page=page.previous_page_number %}" hx-target="{{ hx_target }}" href="#"{% else %}href="?{% url_replace page=page.previous_page_number %}"{% endif %}>‹ Prev</a></li>
    {% endif %}
    <li class="page-item disabled"><span class="page-link">Page {{ page.number }} of {{ page.paginator.num_pages }}</span></li>
    {% if page.has_next %}
      <li class="page-item"><a class="page-link" {% if hx_url %}hx-get="{{ hx_url }}?{% url_replace page=page.next_page_number %}" hx-target="{{ hx_target }}" href="#"{% else %}href="?{% url_replace page=page.next_page_number %}"{% endif %}>Next ›</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
