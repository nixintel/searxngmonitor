{% extends "monitor/base.html" %}
{% block title %}Log in · SearXNG Monitor{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-sm-8 col-md-5 col-lg-4">
  <h1 class="h4 mb-3 text-center"><i class="bi bi-binoculars"></i> SearXNG Monitor</h1>
  <div class="card"><div class="card-body">
    {% if form.errors %}<div class="alert alert-danger small">Wrong username or password.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label" for="id_username">Username</label>
        <input class="form-control" name="username" id="id_username" autofocus required></div>
      <div class="mb-3"><label class="form-label" for="id_password">Password</label>
        <input class="form-control" type="password" name="password" id="id_password" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100">Log in</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
