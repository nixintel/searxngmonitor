# SearXNG Monitor stack.
#   docker compose up -d --build
# Optional profiles (set COMPOSE_PROFILES in .env, comma separated):
#   flower - Celery Flower dashboard on :5555
#   mail   - Mailpit SMTP sink + web UI on :8025 (for testing email alerts)

# The image is built once (by "web") and reused by worker/beat/flower.
x-app: &app
  image: searxngmonitor-app
  pull_policy: never
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    build: .
    pull_policy: build
    volumes:
      - searxng-proxy-config:/app/run/searxng-proxy   # web writes the proxy instance's settings here
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng-proxy-config:
        condition: service_completed_successfully
    ports:
      - "${WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    command: >
      celery -A config worker
      --loglevel=INFO
      --concurrency=${CELERY_CONCURRENCY:-4}
      --hostname=worker@%h

  beat:
    <<: *app
    command: celery -A config beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule

  flower:
    <<: *app
    profiles: ["flower"]
    command: celery -A config flower --port=5555 --basic-auth=${ADMIN_USER}:${ADMIN_PASSWORD}
    ports:
      - "${FLOWER_PORT:-5555}:5555"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-searxngmonitor}
      POSTGRES_USER: ${POSTGRES_USER:-searxngmonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Direct SearXNG instance (no proxy). Internal network only.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
      # Optional; Wikipedia/Wikidata/OSM engines refuse to load without it.
      SEARXNG_CONTACT_URL: ${SEARXNG_CONTACT_URL:-}
    volumes:
      - ./searxng/direct:/etc/searxng:rw

  # Prepares the shared volume that holds the proxy instance's settings.yml. The web app writes the file
  # from Settings -> Proxy; until then a safe default (proxy off) is used.
  searxng-proxy-config:
    image: alpine:3.20
    volumes:
      - ./searxng/proxy/settings.yml.template:/template/settings.yml.template:ro
      - searxng-proxy-config:/etc/searxng
    command:
      - sh
      - -c
      - |
        if [ ! -f /etc/searxng/settings.yml ]; then
          sed -e 's#__INSTANCE_NAME__#"searxngmonitor-proxy-unset"#' -e 's#__PROXY_URL__#"http://127.0.0.1:9"#' \
            /template/settings.yml.template > /etc/searxng/settings.yml
        fi
        chown -R 1000:1000 /etc/searxng
        chmod 0777 /etc/searxng
        chmod 0644 /etc/searxng/settings.yml
        echo "searxng-proxy config volume ready"

  # SearXNG instance for searches marked "Run through proxy". Its proxy is set in the UI (Settings -> Proxy).
  # SearXNG only reads settings at start-up, so a small wrapper restarts it when the web app writes new settings.
  searxng-proxy:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
      # Optional; Wikipedia/Wikidata/OSM engines refuse to load without it.
      SEARXNG_CONTACT_URL: ${SEARXNG_CONTACT_URL:-}
      FORCE_OWNERSHIP: "false"   # keep the volume writable by the web app
    volumes:
      - searxng-proxy-config:/etc/searxng
    entrypoint:
      - /bin/sh
      - -c
      - |
        /usr/local/searxng/entrypoint.sh &
        pid=$$!
        start=$$(md5sum /etc/searxng/settings.yml)
        while kill -0 $$pid 2>/dev/null; do
          sleep 3
          if [ "$$(md5sum /etc/searxng/settings.yml 2>/dev/null)" != "$$start" ]; then
            echo "Proxy settings changed: restarting to apply them"
            kill $$pid; sleep 2; exit 0
          fi
        done
        exit 1
    depends_on:
      searxng-proxy-config:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  pgdata:
  redisdata:
  searxng-proxy-config:
