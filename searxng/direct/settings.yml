# SearXNG settings for the DIRECT instance (no proxy).
# Only overrides are listed; everything else comes from SearXNG's defaults.
# server.secret_key is supplied through the SEARXNG_SECRET environment variable.
use_default_settings: true

general:
  instance_name: "searxngmonitor-direct"

server:
  secret_key: "overridden-by-SEARXNG_SECRET"
  limiter: false          # internal-only instance, used by the monitor app
  public_instance: false
  image_proxy: false

search:
  safe_search: 0
  formats:
    - html
    - json                # required: the monitor app consumes JSON

outgoing:
  request_timeout: 6.0
  max_request_timeout: 15.0

# Make sure the app's default engines are enabled.
engines:
  - name: brave
    disabled: false
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
  - name: mwmbl
    disabled: false
